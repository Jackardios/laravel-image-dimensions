name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, to catch breakage from new dependency releases.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Each Laravel version on the PHP versions it supports.
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependencies: [lowest, highest]
        variant: [default]
        exclude:
          # Laravel 13 requires PHP 8.3.
          - php: '8.2'
            laravel: '13'
        # A variant makes these extra jobs rather than changes to the ones above.
        include:
          # A highest install picks Guzzle 8 where Laravel allows it.
          - { php: '8.5', laravel: '13', dependencies: highest, variant: guzzle-7 }
          # Without ext-intl, host names go through symfony/polyfill-intl-idn.
          - { php: '8.2', laravel: '12', dependencies: lowest, variant: no-intl }
          - { php: '8.5', laravel: '13', dependencies: highest, variant: no-intl }

    name: >-
      PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependencies }}${{ matrix.variant != 'default' && format(' - {0}', matrix.variant) || '' }}

    env:
      # Composer >= 2.9 refuses to install releases with security advisories,
      # and the oldest 12.x and 13.x releases a lowest install must reach have
      # some. The package supports those versions, so the lowest jobs have to
      # be able to install them; the audit job reports advisories for the
      # current highest versions.
      COMPOSER_NO_BLOCKING: ${{ matrix.dependencies == 'lowest' && '1' || '' }}
      TESTBENCH: ${{ matrix.laravel == '12' && '10' || '11' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, libxml, gd${{ matrix.variant == 'no-intl' && ', :intl' || '' }}
          coverage: none

      - name: Constrain Laravel version
        run: |
          # Static analysis and code style run in their own jobs; dropping
          # them here keeps the matrix resolving against the framework alone.
          composer remove --dev --no-update --no-interaction larastan/larastan laravel/pint
          composer require --dev --no-update --no-interaction \
            "laravel/framework:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:^${TESTBENCH}.0"

      - name: Constrain Guzzle version
        if: matrix.variant == 'guzzle-7'
        run: composer require --no-update --no-interaction "guzzlehttp/guzzle:^7.15.2"

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Show installed versions
        run: |
          php -r 'echo "intl: ", extension_loaded("intl") ? "yes" : "no", PHP_EOL;'
          composer show | grep -E '^(laravel/framework|orchestra/testbench-core|phpunit/phpunit|guzzlehttp/guzzle|guzzlehttp/psr7|symfony/polyfill-intl-idn) '

      - name: Run tests
        run: vendor/bin/phpunit --order-by=random

  parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Parallel run (paratest)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, libxml, gd
          coverage: none

      - name: Add paratest
        run: composer require --dev --no-update --no-interaction brianium/paratest

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run tests in parallel
        run: |
          # Warm testbench's package manifest first: processes that all start
          # cold race to write it (an issue of testbench, not of this package).
          vendor/bin/phpunit --filter the_facade_reads_dimensions > /dev/null
          vendor/bin/paratest --processes=8 --order-by=random

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Coverage & mutation testing

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, libxml, gd
          coverage: pcov

      - name: Add Infection
        run: |
          composer config --no-plugins allow-plugins.infection/extension-installer true
          composer require --dev --no-update --no-interaction "infection/infection:^0.35"

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text --coverage-clover=build/coverage.xml

      - name: Mutation testing
        run: vendor/bin/infection --threads=max --no-progress --show-mutations

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12' }
          - { php: '8.5', laravel: '13' }

    name: PHPStan - PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, libxml, gd
          coverage: none

      - name: Constrain Laravel version
        run: >
          composer require --dev --no-update --no-interaction
          "laravel/framework:^${{ matrix.laravel }}.0"

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  code-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Code style & audit

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, libxml, gd
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Audit installed packages
        run: composer audit

  experimental:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Windows, lowest', os: windows-latest, php: '8.2', dependencies: lowest }
          - { name: 'Windows, highest', os: windows-latest, php: '8.5', dependencies: highest }
          - { name: 'PHP nightly', os: ubuntu-latest, php: '8.6', dependencies: highest }

    name: Experimental - ${{ matrix.name }}

    env:
      COMPOSER_NO_BLOCKING: ${{ matrix.dependencies == 'lowest' && '1' || '' }}

    steps:
      - name: Disable Git line-ending conversion
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, libxml, gd
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          # Dependencies may not declare support for an unreleased PHP yet.
          composer-options: ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}

      - name: Run tests
        run: vendor/bin/phpunit --display-deprecations

  laravel-next:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    name: Experimental - Laravel next

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, libxml, gd
          coverage: none

      - name: Require the development versions
        run: |
          # There is no orchestra/testbench release for the next Laravel yet;
          # testbench-core is what the tests use.
          composer remove --dev --no-update --no-interaction orchestra/testbench larastan/larastan laravel/pint
          composer config minimum-stability dev
          composer require --dev --no-update --no-interaction \
            "laravel/framework:dev-master" \
            "orchestra/testbench-core:12.x-dev"

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Show installed versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench-core|phpunit/phpunit) '

      - name: Run tests
        run: vendor/bin/phpunit --display-deprecations
